<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow">
 <title>The Workshop · BuildingSchmidt</title>
 <link rel="stylesheet" href="assets/theme.css?v=split-panes-20261122"><link rel="stylesheet" href="assets/base.css"><link rel="stylesheet" href="assets/components.css?v=css-foundation-20261122"><link rel="stylesheet" href="assets/dialog-system.css"><link rel="stylesheet" href="assets/photo-controls.css"><link rel="stylesheet" href="assets/ui-kit.css?v=split-panes-20261122"><link rel="stylesheet" href="assets/family-workshop.css?v=compact-product-read-20261127">
 <script src="assets/confirmation-dialog.js" defer></script><script src="assets/dialog-system.js" defer></script>
 <script type="module" src="assets/family-workshop.js?v=product-photos-20261127"></script>
<link rel="stylesheet" href="assets/confirmation-dialog.css"></head>
<body class="workshop-app">
 <header class="ui-site-header" data-site-header="commonparts"></header>
<script type="module">import {initSiteHeader} from "/assets/site-header.js?v=css-foundation-20261122"; initSiteHeader();</script>
 <div class="workshop-heading ui-page"><div><h1>The Workshop</h1></div><div class="actions"><a id="return-project" hidden>Back to project</a><button id="export-workshop" class="button">Export Workshop</button></div></div>
 <div class="workshop-layout ui-page">
  <aside class="category-panel" aria-label="Workshop categories"><div class="section-header"><h2>Categories</h2><button id="category-actions" class="button button--quiet">Category actions</button></div><div id="category-tree"></div></aside>
  <section class="family-panel" aria-label="Families"><label class="search-label" for="catalog-search">Search families & products</label><input id="catalog-search" class="field" type="search" placeholder="Name, manufacturer, MPN or specification"><div class="actions catalog-actions"><button id="add-family" class="button button--primary">Add family</button><label class="checkbox"><input id="show-archived" type="checkbox"> Show archived</label></div><div id="family-list"></div></section>
  <main id="workshop-detail" class="detail-panel"><div class="empty">Loading your Workshop…</div></main>
 </div>
 <div id="workshop-status" class="status" role="status" aria-live="polite"></div>
 <dialog id="workshop-dialog" class="dialog"></dialog>
 <div id="category-menu" class="context-menu" role="menu" hidden></div>
<script type="module">import {initSplitPanes} from "/assets/split-panes.js?v=split-panes-20261122"; initSplitPanes(document.querySelector(".workshop-layout"),{key:"workshop",panes:[{key:"categories",name:"categories",selector:".category-panel",wideOnly:true},{key:"families",name:"families",selector:".family-panel"}]});</script>
</body>
</html>
