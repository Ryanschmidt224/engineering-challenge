<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow">
 <title>Knowledge · BuildingSchmidt</title>
 <link rel="stylesheet" href="assets/theme.css?v=split-panes-20261122"><link rel="stylesheet" href="assets/base.css"><link rel="stylesheet" href="assets/components.css?v=css-foundation-20261122"><link rel="stylesheet" href="assets/ui-kit.css?v=split-panes-20261122"><link rel="stylesheet" href="assets/knowledge.css?v=split-panes-20261122">
 <script type="module" src="assets/knowledge.js?v=knowledge-review-20261122"></script>
</head>
<body class="knowledge-app">
 <header class="ui-site-header" data-site-header="knowledge"></header>
<script type="module">import {initSiteHeader} from "/assets/site-header.js?v=css-foundation-20261122"; initSiteHeader();</script>
 <div class="knowledge-heading"><div><p class="eyebrow">Your lessons, written once and linked where they apply</p><h1>Knowledge</h1><p class="muted">Concepts you had to understand, methods you used and lessons from what happened.</p></div></div>
 <div class="knowledge-layout">
  <section class="tile-panel" aria-label="Knowledge tiles">
   <label class="search-label" for="tile-search">Search tiles</label>
   <input id="tile-search" class="field" type="search" placeholder="Title, summary or text">
   <div class="tile-filters">
    <label class="search-label" for="type-filter">Type</label><select id="type-filter" class="field"></select>
    <label class="search-label" for="status-filter">Status</label><select id="status-filter" class="field"></select>
   </div>
   <div class="actions catalog-actions"><button id="new-tile" class="button button--primary" type="button">New tile</button><label class="checkbox"><input id="show-archived" type="checkbox"> Show archived</label></div>
   <div id="tile-list"></div>
  </section>
  <main id="knowledge-detail" class="detail-panel"><div class="empty">Loading your Knowledge…</div></main>
 </div>
 <div id="knowledge-status" class="status" role="status" aria-live="polite"></div>
 <dialog id="knowledge-dialog" class="dialog"></dialog>
<script type="module">import {initSplitPanes} from "/assets/split-panes.js?v=split-panes-20261122"; initSplitPanes(document.querySelector(".knowledge-layout"),{key:"knowledge",panes:[{key:"tiles",name:"tiles",selector:".tile-panel"}]});</script>
</body>
</html>
