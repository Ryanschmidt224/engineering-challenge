lass="btn" data-nav="home">← Projects</button><div class="eyebrow" style="margin-top:26px">Project 002</div><h1>Electromagnetic linear actuator</h1><p class="lead">Move a magnet with switched coils.</p><div class="grid two"><div class="card"><h3>Project question</h3><p>How can switched coils move and position a magnet?</p></div><div class="card"><h3>Topics</h3><p>Fields, coil geometry, H-bridges, Hall sensors, and feedback.</p></div></div><div class="section"><h2>Questions</h2><div class="grid two"><div class="card"><h3>Why does a coil produce a voltage spike?</h3><p>What happens when current changes?</p><button class="btn" data-topic="voltage">Open</button></div><div class="card"><h3>How do you test a control circuit?</h3><p>Measure, test, and verify.</p><button class="btn" data-topic="measurement">Open</button></div></div></div><button class="btn primary" data-nav="launcher">Workshop</button></div><div class="component-section" data-components=""><details><summary>Components / bill of materials</summary><div class="component-list"></div><details class="component-admin"><summary>Import component</summary><label>Product URL or description<textarea class="field component-description" rows="5" placeholder="Paste a product page URL or product title and specifications"></textarea></label><button class="btn component-extract" type="button">Look up product details</button><p class="small muted component-status" role="status"></p><div class="component-review hide"><label>Headline name<input class="field component-name" maxlength="180" placeholder="Short name shown in the BOM and feature tree"></label><label>Full name<input class="field component-full-name" maxlength="300" placeholder="Complete part name or product description"></label><label>Quantity<input class="field component-quantity" type="number" min="0.000001" max="10000000" step="any" placeholder="Leave blank if unknown"></label><label>Unit<select class="field component-quantity-unit"><option value="pcs">pcs</option><option value="in">in</option><option value="m">m</option><option value="mm">mm</option><option value="ft">ft</option><option value="g">g</option><option value="kg">kg</option><option value="mL">mL</option><option value="L">L</option><option value="">Unspecified</option></select></label><div class="historical-price-fields"><label>Historical part price (USD)<input class="field component-historical-price" type="number" min="0" max="10000000" step="0.01" placeholder="e.g. 12.99"></label><label>Price for<select class="field component-historical-price-basis"><option value="per_part">Per part</option><option value="per_package">Per package</option></select></label><label class="historical-package-count" hidden>Parts per package<input class="field component-historical-package-quantity" type="number" min="1" max="1000000" step="1" placeholder="e.g. 10"></label><label>Price recorded on<input class="field component-historical-price-date" type="date"></label><p class="historical-unit-hint small muted" aria-live="polite"></p></div><label>Manufacturer<input class="field component-manufacturer"></label><label>Mfg part number<input class="field component-model"></label><label>Category<input class="field component-category"></label><label>Supplier<input class="field component-supplier"></label><label>Amazon ASIN<input class="field component-asin"></label><h3>Specifications</h3><div class="component-specs"></div><button class="btn component-add-spec" type="button">Add specification</button><button class="btn primary component-save" type="button">Save component</button></div></details></details></div><div class="photos" data-photos=""><h2>Photos</h2><div class="photo-grid"></div><p class="photo-status" role="status">Loading photos…</p><details class="photo-admin"><summary>Manage photos</summary><p class="small muted">Only the administrator can upload or delete photos. Annotate them in your phone or tablet's photo editor first.</p><div class="photo-upload"><input class="field photo-caption" type="text" maxlength="240" placeholder="Caption (optional) — enter before choosing a photo"><div class="photo-dropzone" role="button" tabindex="0" aria-label="Choose a photo or drop a photo here"><span class="photo-drop-icon" aria-hidden="true">↑</span><strong>Drop a photo here</strong><span>or click to browse files</span><span class="small muted">JPG, PNG, WebP, GIF, HEIC · up to 10 MB</span><input class="photo-file" type="file" accept="image/jpeg,image/png,image/webp,image/gif,image/heic,image/heif,image/*" aria-label="Choose photo"></div><div class="photo-preview hide"><img alt="Selected photo preview"><span class="photo-filename"></span><button class="btn photo-clear" type="button">Remove</button></div><p class="photo-upload-status small" role="status" aria-live="polite"></p></div><p class="small muted">Your login stays active for up to 30 days. Selecting or dropping a photo uploads it automatically. Max 10 MB.</p></details></div></div></div></div></section></template>
